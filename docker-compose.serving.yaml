services:
  serving-base:
    image: mlflow-serving-base:latest
    build:
      context: .
      dockerfile: serving/Dockerfile.base
    command: ["true"]
    profiles: [build]

  serve-qwen3-asr-1.7b:
    image: mlflow-serving/qwen3-asr-1.7b:latest
    container_name: mr-serve-qwen3-asr-1.7b
    build:
      context: .
      dockerfile: serving/Dockerfile.model
      args:
        MODEL: qwen3-asr-1.7b
    profiles: [qwen3-asr-1.7b]
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_started
    environment:
      SERVING_MODEL_URI: models:/qwen3-asr-1.7b@serving
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_CACHE: /models
      HF_HOME: /models/.hf
      MLFLOW_SCORING_SERVER_REQUEST_TIMEOUT: "600"
    volumes:
      - serving_models:/models
    ports:
      - "5001:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

